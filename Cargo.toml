[package]
name = "3d-webrender"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.128"
js-sys = "0.3.105"

wgpu = { version = "30.0.1", default-features = false, features = [
    "webgl",
    "webgpu",
] }

glam = "0.30"

console_error_panic_hook = "0.1.7"
console_log = { version = "1.1.0", features = ["color"] }

winit = { version = "0.30.12", default-features = false, features = [
    "rwh_06",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
